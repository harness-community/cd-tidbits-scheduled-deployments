# service.yaml — Harness Kubernetes service (Services v2).
# Deploys the public nginx container using File Store manifests + a Docker artifact source.
#
# Import: Deployments > Services > New Service > YAML, paste, Save.
# Identifiers must be unique within the project.
service:
  name: svc_tid0062
  identifier: svc_tid0062
  orgIdentifier: default # REPLACE: your org identifier
  projectIdentifier: project_1 # REPLACE: your project identifier
  serviceDefinition:
    type: Kubernetes
    spec:
      manifests:
        - manifest:
            identifier: tid0062_manifest
            type: K8sManifest
            spec:
              skipResourceVersioning: false
              enableDeclarativeRollback: false
              store:
                type: Github
                spec:
                  connectorRef: account.github_public # REPLACE: your GitHub connector
                  gitFetchType: Branch
                  paths:
                    - k8s/namespace.yaml
                    - k8s/deployment.yaml
                    - k8s/service.yaml
                  repoName: cd-tidbits-scheduled-deployments # REPLACE: your fork
                  branch: main
              valuesPaths:
                - k8s/values.yaml
      artifacts:
        primary:
          primaryArtifactRef: nginx
          sources:
            - identifier: nginx
              type: DockerRegistry
              spec:
                connectorRef: account.Docker # REPLACE: your DockerHub connector (anonymous is fine for public images)
                imagePath: library/nginx # public nginx image; `library/` prefix required for official images
                tag: stable # REPLACE: pin any tag, or use <+input> to pick at runtime
  gitOpsEnabled: false
