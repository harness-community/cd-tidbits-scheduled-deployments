# Reference: Weekday Staging Deploy Trigger
# ─────────────────────────────────────────────────────────────────────────────
# In Harness, triggers are managed under Pipelines → <pipeline> → Triggers.
# You can create this trigger in the UI or import this YAML directly.
# ─────────────────────────────────────────────────────────────────────────────

trigger:
  name: Weekday Staging Deploy
  identifier: weekday_staging_deploy
  enabled: true
  description: Deploy to staging every weekday morning at 6 AM UTC before the team starts work

  # ── Schedule configuration ────────────────────────────────────────────────
  source:
    type: Scheduled
    spec:
      type: Cron
      spec:
        expression: "0 6 * * 1-5"   # Mon–Fri at 6:00 AM UTC (1=Monday, 5=Friday)
        type: UNIX

  # ── Pipeline to trigger ───────────────────────────────────────────────────
  pipelineIdentifier: scheduled_deploy
  pipelineBranchName: main

  # ── Input values provided by this trigger ─────────────────────────────────
  inputYaml: |
    pipeline:
      identifier: scheduled_deploy
      variables:
        - name: environment
          type: String
          value: staging
        - name: appVersion
          type: String
          value: latest
